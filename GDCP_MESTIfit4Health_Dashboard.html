<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDCP MESTIfit4Health Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f8f9;
    color:#18343c;
}

header{
    background:linear-gradient(120deg,#003f4f,#007d78,#00a99d);
    color:white;
    padding:40px 6%;
}

header .small{
    font-size:12px;
    letter-spacing:2px;
    font-weight:bold;
    opacity:.8;
}

header h1{
    margin:7px 0 5px;
    font-size:32px;
}

header p{
    margin:0;
    opacity:.85;
}

main{
    width:90%;
    max-width:1450px;
    margin:auto;
}

.title{
    margin-top:30px;
    margin-bottom:14px;
}

.title h2{
    margin:0;
    font-size:20px;
}

.title p{
    margin:5px 0 0;
    color:#78909c;
    font-size:12px;
}


/* KPI */

.kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.kpi{
    background:white;
    padding:21px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,60,70,.07);
}

.kpi small{
    color:#78909c;
    text-transform:uppercase;
    font-weight:bold;
}

.number{
    font-size:38px;
    font-weight:750;
    margin-top:8px;
    color:#075a5e;
}

.teal{border-top:4px solid #00a99d;}
.green{border-top:4px solid #37b77a;}
.orange{border-top:4px solid #ff9d42;}
.blue{border-top:4px solid #4169e1;}


/* VENUE */

.venues{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.venue{
    padding:27px;
    color:white;
    border-radius:18px;
}

.district{
    background:linear-gradient(120deg,#00766f,#00afa4);
}
